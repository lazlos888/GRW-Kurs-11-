<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Globalisierung I – Abschlussquiz</title>
<style>
  :root { --bg:#f4f7f8; --card:#ffffff; --text:#1e1e1e; --muted:#5f6b70; --navy:#12343b;
          --accent:#e2711d; --ok:#1d7a3e; --ok-bg:#e3f3e8; --bad:#b3261e; --bad-bg:#fbe5e3; --line:#d5dee0; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1c1f; --card:#18292d; --text:#eef3f4; --muted:#a9b8bc; --navy:#9fc3cb;
            --accent:#f0954f; --ok:#7fd49b; --ok-bg:#183626; --bad:#f2a49d; --bad-bg:#3a1d1b; --line:#2c4247; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text);
         font: 17px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif; }
  main { max-width: 640px; margin: 0 auto; padding: 20px 16px 48px; }
  .course { color:var(--muted); font-size:14px; margin:0; }
  h1 { color:var(--navy); font-size:24px; margin:4px 0 6px; }
  .hint { color:var(--muted); font-size:15px; margin:0 0 18px; }
  .q { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; margin-bottom:14px; }
  .q h2 { font-size:17px; margin:0 0 12px; }
  .q h2 span { color:var(--accent); margin-right:6px; }
  button.opt { display:block; width:100%; text-align:left; font:inherit; color:inherit; background:transparent;
               border:1px solid var(--line); border-radius:10px; padding:11px 12px; margin-bottom:8px; cursor:pointer; }
  button.opt:disabled { cursor:default; }
  button.opt.right { border-color:var(--ok); background:var(--ok-bg); font-weight:600; }
  button.opt.wrong { border-color:var(--bad); background:var(--bad-bg); }
  .explain { margin:6px 0 0; font-size:15px; }
  .explain b.r { color:var(--ok); } .explain b.f { color:var(--bad); }
  #result { background:var(--navy); color:#fff; border-radius:12px; padding:18px; text-align:center; display:none; }
  @media (prefers-color-scheme: dark) { #result { color:#0f1c1f; } }
  #result strong { display:block; font-size:30px; }
  footer { color:var(--muted); font-size:13px; margin-top:22px; }
</style>
</head>
<body>
<main>
  <p class="course">GRW · Grundkurs 11 · 10.11.2026</p>
  <h1>Globalisierung I – Abschlussquiz</h1>
  <p class="hint">Tippe jeweils eine Antwort an. Du siehst sofort, ob sie stimmt. Merk dir die Fragen, bei denen du unsicher warst.</p>
  <div id="quiz"></div>
  <div id="result"><strong id="score"></strong><span id="verdict"></span></div>
  <footer>Dieses Quiz speichert und sendet keine Daten. Inhalte nach: Hans-Böckler-Stiftung (2021): Themenheft Globalisierung.</footer>
</main>
<script>
const QUESTIONS = [{"question": "Containerschiffe bringen Jeans aus Asien nach Europa. Welche Wirkungskette verbindet mindestens drei Dimensionen der Globalisierung?", "options": ["Welthandel wächst → Jeans werden billiger → Kundinnen und Kunden kaufen mehr Jeans", "Schiffe werden größer → Häfen werden ausgebaut → Hafengebühren steigen", "Welthandel wächst → mehr Schiffsverkehr und CO₂-Ausstoß → Staaten verhandeln über Klimaschutz", "Jeans werden weltweit getragen → Jeans gelten als Mode → Jeans werden noch bekannter"], "answer": 2, "explanation": "Nur hier greifen Wirtschaft (Handel), Umwelt (CO₂) und Politik (Verhandlungen) ineinander. Die anderen Ketten bleiben innerhalb einer Dimension."}, {"question": "Die Eigenmarken-Jeans kostet im Laden 22,10 $, ihre Fabrikation in Bangladesch 1,16 $. Wie groß ist der Anteil der Fabrikation am Ladenpreis ungefähr?", "options": ["ca. 1 %", "ca. 5 %", "ca. 12 %", "ca. 25 %"], "answer": 1, "explanation": "1,16 : 22,10 ≈ 0,052, also rund 5 %. Rund die Hälfte des Preises (11,17 $) bleibt beim Einzelhandel."}, {"question": "Fracht, Hafengebühren und Spedition kosten bei der Eigenmarken-Jeans zusammen 0,60 $ – weniger als 3 % des Ladenpreises. Welche Schlussfolgerung ist am besten begründet?", "options": ["Weite Transportwege fallen bei der Standortwahl kaum ins Gewicht.", "Transport ist der wichtigste Kostenfaktor der Jeans.", "Eine Produktion in Deutschland wäre deshalb billiger.", "Damit sind auch die Umweltfolgen des Transports gering."], "answer": 0, "explanation": "Weil Transport so wenig kostet, lohnen sich auch 50.000 km. Vorsicht: Der Preis sagt nichts darüber, wie groß die Umweltfolgen des Transports sind."}, {"question": "Welcher Faktor ist eine Voraussetzung der weltweiten Arbeitsteilung, aber kein Grund, einen bestimmten Standort zu wählen?", "options": ["Abbau von Handelsschranken wie Zöllen", "Niedrige Lohnkosten", "Rohstoffe vor Ort", "Nähe zum Absatzmarkt"], "answer": 0, "explanation": "Lohnkosten, Rohstoffe und Absatzmarkt sind Standortfaktoren. Der Abbau von Handelsschranken macht die Verteilung über Grenzen erst möglich – und beruht auf politischen Entscheidungen."}, {"question": "Angenommenes Beispiel: Ein Sportschuh wird in Deutschland entworfen, in Vietnam genäht und in ganz Europa verkauft. Welcher Fachbegriff beschreibt das am genauesten?", "options": ["Protektionismus", "Internationale Arbeitsteilung entlang der Wertschöpfungskette", "Autarkie", "Freihandelszone"], "answer": 1, "explanation": "Die Schritte der Wertschöpfung (Entwurf, Fertigung, Verkauf) werden auf verschiedene Länder verteilt. Protektionismus heißt Schutz der eigenen Wirtschaft (z. B. durch Zölle), Autarkie Selbstversorgung; eine Freihandelszone ist ein Abkommen zwischen Staaten."}, {"question": "Die Fabrikation kostet bei der Premium-Jeans (USA) 11,65 $, bei der Eigenmarken-Jeans (Bangladesch) 1,16 $. Warum belegt dieser Vergleich Lohnunterschiede nur eingeschränkt?", "options": ["Weil die Werte in verschiedenen Währungen angegeben sind und sich nicht vergleichen lassen.", "Weil in Bangladesch nur der Stoff hergestellt und die Jeans woanders genäht wird.", "Weil die Transportkosten fehlen, die bei der Premium-Jeans viel höher sind.", "Weil es verschiedene Produkte sind und die Fabrikationskosten mehr als nur Löhne enthalten."], "answer": 3, "explanation": "Beide Werte sind in US-Dollar (nur M2 rechnet in Euro). Aber die Premium-Jeans ist aufwendiger verarbeitet, und in den 1,16 $ steckt z. B. auch der Gewinn des Fabrikanten (0,26 $)."}, {"question": "These: „Die Jeans reist um die halbe Welt, weil Arbeit in Asien billig ist.“ Welches Urteil ist durch M1–M3 am besten belegt?", "options": ["Stimmt vollständig: Die Fabrikation in Bangladesch kostet nur ein Zehntel, deshalb wandert die ganze Produktion nach Asien.", "Stimmt nicht: Die Fabrikation macht nur rund 5 % des Preises aus, Lohnkosten spielen also keine Rolle.", "Stimmt teilweise: Billige Arbeit erklärt das Nähen, aber 7 von 12 Stationen liegen in Europa – dort zählen Spezialisierung, Rohstoffe oder der Absatzmarkt.", "Lässt sich nicht beurteilen: M1 und M3 zeigen verschiedene Jeans, also darf man sie nicht verbinden."], "answer": 2, "explanation": "Billige Arbeit ist ein wichtiger Grund, aber nicht der einzige. Dass 5 % wenig klingen, heißt nicht, dass Löhne egal sind: Bei einer Jeans für 22,10 $ zählt jeder Dollar."}, {"question": "Angenommen, ein Staat erhebt plötzlich hohe Zölle auf importierte Jeans. Was folgt daraus nach den Ergebnissen dieser Stunde am ehesten?", "options": ["Nichts – Globalisierung folgt Marktgesetzen, die die Politik nicht ändern kann.", "Die Löhne in Bangladesch steigen automatisch.", "Die Transportkosten sinken weiter.", "Eine Voraussetzung der Arbeitsteilung wird geschwächt; Unternehmen kalkulieren ihre Standorte neu."], "answer": 3, "explanation": "Zölle sind politische Entscheidungen. Werden Handelsschranken wieder aufgebaut, werden Importe teurer und Standorte neu berechnet. Ob Globalisierung ein „Naturgesetz“ ist, klären wir nächste Stunde."}];
const quiz = document.getElementById('quiz');
let answered = 0, correct = 0;

QUESTIONS.forEach((q, qi) => {
  const box = document.createElement('section');
  box.className = 'q';
  const h = document.createElement('h2');
  h.innerHTML = '<span>' + (qi + 1) + '/' + QUESTIONS.length + '</span>';
  h.appendChild(document.createTextNode(q.question));
  box.appendChild(h);
  const buttons = q.options.map((text, oi) => {
    const b = document.createElement('button');
    b.className = 'opt';
    b.type = 'button';
    b.textContent = text;
    b.addEventListener('click', () => choose(oi));
    box.appendChild(b);
    return b;
  });
  const explain = document.createElement('p');
  explain.className = 'explain';
  box.appendChild(explain);
  quiz.appendChild(box);

  function choose(oi) {
    buttons.forEach(b => b.disabled = true);
    buttons[q.answer].classList.add('right');
    const isRight = oi === q.answer;
    if (!isRight) buttons[oi].classList.add('wrong');
    explain.innerHTML = isRight ? '<b class="r">Richtig.</b> ' : '<b class="f">Leider falsch.</b> ';
    explain.appendChild(document.createTextNode(q.explanation));
    answered++;
    if (isRight) correct++;
    if (answered === QUESTIONS.length) showResult();
  }
});

function showResult() {
  document.getElementById('score').textContent = correct + ' von ' + QUESTIONS.length + ' richtig';
  document.getElementById('verdict').textContent = correct >= 7 ? 'Stark – du hast die Stunde sicher im Griff.'
    : correct >= 5 ? 'Gut – schau dir die falschen Fragen noch einmal an.'
    : 'Geh die Fragen mit deinem Heft noch einmal durch.';
  const r = document.getElementById('result');
  r.style.display = 'block';
  r.scrollIntoView({ behavior: 'smooth' });
}
</script>
</body>
</html>
